aid: mirelo
name: Mirelo
description: >-
  Mirelo is a Berlin-based AI research lab building state-of-the-art audio
  foundation models for visual media. Its flagship Mirelo SFX model generates
  production-ready, perfectly synced sound effects directly from video (or from
  text prompts) with no background-music noise, plus iterative editing, audio
  inpainting, sound extension, and a multi-instrument Audio-to-MIDI model. Mirelo
  ships a self-serve REST API (https://api.mirelo.ai/v2/), the Mirelo Studio web
  app, official Node.js and Python SDKs, and editor plugins for Adobe Premiere
  Pro, DaVinci Resolve, Reaper, and Roblox Studio. The models are also
  distributed on fal.ai, Replicate, and Runware. Founded by musicians-turned-AI
  researchers from Amazon, Google Brain, Max Planck and ETH Zurich, Mirelo
  raised a $41M seed round co-led by Index Ventures and Andreessen Horowitz in
  December 2025.
