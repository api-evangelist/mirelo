apis:
- name: Mirelo SFX API
  description: >-
    Self-serve REST API to generate and edit sound effects from video or text.
    Bearer-token (API key) auth; JSON request/response returning generated audio
    asset URLs; synchronous and asynchronous (job-polling) modes; a preflight
    endpoint returns credit cost and estimated processing time before billing.
    Model revisions are pinned in the request path (e.g. text-to-sfx/v1.6).
